<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="crysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
    <filter id="crysGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#a855f7" flood-opacity="0.6"/>
    </filter>
  </defs>
  <ellipse cx="60" cy="106" rx="34" ry="6" fill="rgba(0,0,0,0.3)"/>
  <!-- Levitating Crystal -->
  <g filter="url(#crysGlow)">
    <polygon points="60,18 78,54 60,94 42,54" fill="url(#crysGrad)"/>
    <polygon points="60,18 78,54 60,94" fill="#c084fc"/>
    <polygon points="60,18 60,94 42,54" fill="#7e22ce"/>
    <!-- Orbiting Energy Ring -->
    <ellipse cx="60" cy="56" rx="36" ry="12" stroke="#e879f9" stroke-width="2" fill="none" stroke-dasharray="8,4" transform="rotate(-15 60 56)"/>
  </g>
</svg>
