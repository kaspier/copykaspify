<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="35%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#eab308" flood-opacity="0.5"/>
    </filter>
  </defs>
  <ellipse cx="60" cy="106" rx="34" ry="6" fill="rgba(0,0,0,0.4)"/>
  <!-- Trophy Base Pedestal -->
  <path d="M40,94 L80,94 L84,104 L36,104 Z" fill="#1e293b"/>
  <rect x="42" y="86" width="36" height="8" rx="2" fill="url(#goldGrad)"/>
  <path d="M54,68 L66,68 L64,86 L56,86 Z" fill="url(#goldGrad)"/>
  <!-- Trophy Cup -->
  <g filter="url(#goldGlow)">
    <path d="M34,26 L86,26 C86,26 86,64 60,68 C34,64 34,26 34,26 Z" fill="url(#cupGrad)"/>
    <ellipse cx="60" cy="26" rx="26" ry="6" fill="#fef08a"/>
    <ellipse cx="60" cy="26" rx="22" ry="4" fill="#a16207"/>
    <!-- Trophy Handles -->
    <path d="M34,32 C20,32 18,52 38,54" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M86,32 C100,32 102,52 82,54" stroke="url(#goldGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- Star on Cup -->
    <polygon points="60,38 63,45 70,45 64,49 66,56 60,51 54,56 56,49 50,45 57,45" fill="#ffffff"/>
  </g>
</svg>
