  <line x1="55" y1="42" x2="83" y2="42" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Cyber Headband -->
  <path d="M48,34 C58,26 78,26 88,34" stroke="#06b6d4" stroke-width="3" fill="none"/>
