  <circle cx="68" cy="42" r="22" fill="url(#duckSkin)"/>
  <!-- Duck Beak -->
  <path d="M84,40 C98,42 102,50 86,54 Z" fill="#ea580c"/>
  <!-- Cyber Visor Glasses -->
