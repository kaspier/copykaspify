<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="diaTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="diaMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="diaBot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <filter id="diaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>
  <ellipse cx="60" cy="104" rx="36" ry="7" fill="rgba(0,0,0,0.3)"/>
  <!-- Diamond Shape -->
  <g filter="url(#diaGlow)">
    <polygon points="40,36 80,36 98,54 60,98 22,54" fill="url(#diaBot)"/>
    <!-- Top Crown Facets -->
    <polygon points="40,36 80,36 70,54 50,54" fill="url(#diaTop)"/>
    <polygon points="40,36 50,54 22,54" fill="#bfdbfe"/>
    <polygon points="80,36 98,54 70,54" fill="#60a5fa"/>
    <!-- Pavilion Facets -->
    <polygon points="50,54 70,54 60,98" fill="url(#diaMid)"/>
    <polygon points="22,54 50,54 60,98" fill="#1d4ed8"/>
    <polygon points="70,54 98,54 60,98" fill="#2563eb"/>
    <!-- Sparkles -->
    <polygon points="36,30 38,36 44,38 38,40 36,46 34,40 28,38 34,36" fill="#ffffff"/>
    <polygon points="84,48 86,52 90,53 86,55 84,59 82,55 78,53 82,52" fill="#ffffff"/>
  </g>
</svg>
