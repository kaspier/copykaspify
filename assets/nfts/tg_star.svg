<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="starGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="30%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.8"/>
    </filter>
  </defs>
  <ellipse cx="60" cy="106" rx="34" ry="7" fill="rgba(0,0,0,0.3)"/>
  <!-- 3D Star Shape -->
  <g filter="url(#starGlow)">
    <polygon points="60,16 73,44 104,47 80,68 87,98 60,82 33,98 40,68 16,47 47,44" fill="url(#starGold)"/>
    <!-- 3D Facets on Star -->
    <polygon points="60,16 60,82 73,44" fill="#fef08a"/>
    <polygon points="60,16 60,82 47,44" fill="#f59e0b"/>
    <polygon points="104,47 60,82 80,68" fill="#d97706"/>
    <polygon points="16,47 60,82 40,68" fill="#b45309"/>
    <polygon points="87,98 60,82 60,60" fill="#92400e"/>
    <polygon points="33,98 60,82 60,60" fill="#78350f"/>
    <!-- Central Highlight -->
    <circle cx="60" cy="56" r="8" fill="#ffffff" opacity="0.6"/>
  </g>
</svg>
